<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <audio id="bg-audio" autoplay loop>
        <source src="background-music.mpeg" type="audio/mpeg">
    </audio>
    <div class="container">
        <video src="" id="camera" autoplay playsinline></video>
        <div class="inner">
            <h2>My Next Relationship</h2>
            <div class="progress-container">
                <div class="progress-line">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>

                <div class="step active">
                    <div class="dot"></div>
                    <p id="age">Age</p>

                </div>

                <div class="step">
                    <div class="dot"></div>
                    <p id="height">Height</p>
                </div>

                <div class="step">
                    <div class="dot"></div>
                    <p id="weight">Weight</p>
                </div>

                <div class="step">
                    <div class="dot"></div>
                    <p id="gender">Gender</p>
                </div>

                <div class="step">
                    <div class="dot"></div>
                    <p id="job">Job</p>
                </div>

                <div class="step">
                    <div class="dot"></div>
                    <p id="type">Type</p>
                </div>

                <div class="step">
                    <div class="dot"></div>
                    <p id="hobbies">Hobbies</p>
                </div>

            </div>
            <button id="start">Start</button>

        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
